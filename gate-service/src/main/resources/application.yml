server:
  port: 8081

spring:
  application:
    name: gate-service

  cloud:
    stream:
      default-binder: rabbit
      bindings:
        gateEvents-out-0:
          destination: park.events
          content-type: application/json
          producer:
            required-groups:
              - analytics
              - logging
      rabbit:
        bindings:
          gateEvents-out-0:
            producer:
              routing-key-expression: "'gate.visitor.entered'"

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

actor:
  logging:
    directory: logs/gate-service/actors

logging:
  level:
    com.music: DEBUG
    org.springframework.cloud.stream: INFO
