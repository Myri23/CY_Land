spring:
  application:
    name: gate-service

  cloud:
    stream:
      default-binder: rabbit
      bindings:
        gateEvents-out-0:
          destination: park.events
          content-type: application/json
          producer:
            required-groups:
              - analytics
              - logging

      rabbit:
        bindings:
          gateEvents-out-0:
            producer:
              routing-key-expression: "'gate.visitor.entered'"

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.park: DEBUG
    org.springframework.cloud.stream: INFO
